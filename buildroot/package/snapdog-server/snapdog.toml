# SnapDog Server Configuration
# Edit via SnapDog Control (http://snapdog) or manually.

[system]
log_level = "info"
# SnapDog OS keeps runtime state on the persistent data partition. The service
# can write this directory, while the parent configuration directory stays
# read-only inside the service sandbox.
state_dir = "/data/snapdog/state"

[audio]
sample_rate = 48000
bit_depth = 16
channels = 2
source_conflict = "last_wins"
zone_switch_fade_ms = 300
source_switch_fade_ms = 300

# AirPlay is a built-in SnapDog source. It is always available; optional
# password and bind-address overrides can be added through SnapDog Control.
[airplay]
mode = "airplay2"

[snapcast]
streaming_port = 1704
codec = "flac"
group_volume_mode = "relative"
unknown_clients = "accept"
managed = true

[mdns]
enabled = true
advertise_snapcast = false

[[zone]]
name = "Default Zone"
icon = "🔊"
