name: Release snapdog-update

on:
  push:
    tags: ["snapdog-update-v*"]

permissions:
  contents: read

concurrency:
  group: snapdog-update-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.88.0"

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      source_epoch: ${{ steps.meta.outputs.source_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release source
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF}" != "refs/tags/${TAG}" ]; then
            echo "snapdog-update releases must originate from a tag push" >&2
            exit 1
          fi

          VERSION="${TAG#snapdog-update-v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ "$VERSION" = "$TAG" ] || [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "Expected tag format snapdog-update-v<semver>, got '${TAG}'" >&2
            exit 1
          fi

          ENCODED_TAG="$(jq -rn --arg tag "$TAG" '$tag | @uri')"
          SOURCE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ENCODED_TAG}" --jq .sha)"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve ${TAG} to a commit" >&2
            exit 1
          fi
          if [ "$SOURCE_SHA" != "$GITHUB_SHA" ]; then
            echo "Tag ${TAG} resolves to ${SOURCE_SHA}, but this event is for ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "Checked-out release source does not match resolved tag commit" >&2
            exit 1
          fi
          SOURCE_STATUS=$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...main" --jq '.status')
          if [ "$SOURCE_STATUS" != "ahead" ] && [ "$SOURCE_STATUS" != "identical" ]; then
            echo "Tag source ${SOURCE_SHA} is not an ancestor of protected main" >&2
            exit 1
          fi

          MANIFEST_VERSION="$(jq -er '.["snapdog-update"] | strings' .release-please-manifest.json)"
          CARGO_VERSION="$(python3 - <<'PY'
          import tomllib

          with open("snapdog-update/Cargo.toml", "rb") as cargo_file:
              print(tomllib.load(cargo_file)["package"]["version"])
          PY
          )"
          if [ "$VERSION" != "$MANIFEST_VERSION" ] || [ "$VERSION" != "$CARGO_VERSION" ]; then
            printf '%s\n' \
              "Release version mismatch for ${TAG}:" \
              "  tag:                    ${VERSION}" \
              "  release-please manifest: ${MANIFEST_VERSION}" \
              "  Cargo.toml:              ${CARGO_VERSION}" >&2
            exit 1
          fi

          # A hyphen before optional build metadata marks a SemVer prerelease.
          # Prereleases still publish GitHub assets but must NOT overwrite the Homebrew formula.
          VERSION_WITHOUT_BUILD="${VERSION%%+*}"
          case "$VERSION_WITHOUT_BUILD" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "source_sha=${SOURCE_SHA}"
            echo "source_epoch=$(git show -s --format=%ct "$SOURCE_SHA")"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build snapdog-update (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            binary: snapdog-update
            archive: tar
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            binary: snapdog-update
            archive: tar
            smoke: false
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: snapdog-update
            archive: tar
            smoke: true
          - target: aarch64-apple-darwin
            os: macos-15
            binary: snapdog-update
            archive: tar
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: snapdog-update.exe
            archive: zip
            smoke: true
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            binary: snapdog-update.exe
            archive: zip
            smoke: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.source_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: snapdog-update
          key: release-${{ matrix.target }}

      - name: Install Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Linux build tools
        if: runner.os == 'Linux' && matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake

      - name: Build release binary
        working-directory: snapdog-update
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          SNAPDOG_UPDATE_VERSION: ${{ needs.meta.outputs.version }}
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Verify release version
        if: matrix.smoke
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary }}
          EXPECTED_VERSION: ${{ needs.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BINARY="snapdog-update/target/${TARGET}/release/${BINARY_NAME}"
          ACTUAL_VERSION="$("$BINARY" --version)"
          test "$ACTUAL_VERSION" = "snapdog-update ${EXPECTED_VERSION}"

      - name: Package archive
        shell: bash
        env:
          ARCHIVE_FORMAT: ${{ matrix.archive }}
          BINARY_NAME: ${{ matrix.binary }}
          TAG: ${{ needs.meta.outputs.tag }}
          TARGET: ${{ matrix.target }}
          SOURCE_EPOCH: ${{ needs.meta.outputs.source_epoch }}
        run: |
          set -euo pipefail
          ARCHIVE="${TAG}-${TARGET}"

          mkdir "$ARCHIVE"
          cp "snapdog-update/target/${TARGET}/release/${BINARY_NAME}" "$ARCHIVE/"
          cp snapdog-update/README.md "$ARCHIVE/README.md"
          cp LICENSE "$ARCHIVE/LICENSE"

          if [ "$ARCHIVE_FORMAT" = "zip" ]; then
            ASSET="${ARCHIVE}.zip"
          else
            ASSET="${ARCHIVE}.tar.gz"
          fi
          PYTHON=python3
          command -v "$PYTHON" >/dev/null 2>&1 || PYTHON=python
          "$PYTHON" scripts/package_updater_release.py \
            --source "$ARCHIVE" --output "$ASSET" \
            --format "$ARCHIVE_FORMAT" --epoch "$SOURCE_EPOCH"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "${ASSET}.sha256"
          else
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapdog-update-${{ matrix.target }}
          path: |
            snapdog-update-*.tar.gz
            snapdog-update-*.tar.gz.sha256
            snapdog-update-*.zip*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: Publish GitHub release assets
    runs-on: ubuntu-24.04
    needs: [meta, build]
    environment: updater-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          mkdir release-assets
          find artifacts -type f \( \
            -name '*.tar.gz' -o \
            -name '*.tar.gz.sha256' -o \
            -name '*.zip' -o \
            -name '*.zip.sha256' \
          \) -exec cp {} release-assets/ \;

          mapfile -t archives < <(find release-assets -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          mapfile -t checksums < <(find release-assets -maxdepth 1 -type f \( -name '*.tar.gz.sha256' -o -name '*.zip.sha256' \) | sort)
          test "${#archives[@]}" -eq 6
          test "${#checksums[@]}" -eq 6

          cd release-assets
          for checksum in ./*.sha256; do
            sha256sum --check "$checksum"
          done
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS

      - name: Verify existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.meta.outputs.source_sha }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail

          verify_tag_source() {
            local encoded_tag resolved_sha
            encoded_tag=$(jq -rn --arg tag "$TAG" '$tag | @uri')
            resolved_sha=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${encoded_tag}" --jq .sha)
            if [[ ! "$resolved_sha" =~ ^[0-9a-f]{40}$ ]] || \
               [ "$resolved_sha" != "$SOURCE_SHA" ]; then
              echo "Tag ${TAG} no longer resolves to release source ${SOURCE_SHA} (got ${resolved_sha:-invalid})" >&2
              exit 1
            fi
          }

          # Release Please normally owns the draft. Re-check the protected tag
          # immediately before the fallback path creates any release state.
          verify_tag_source
          # GET /releases/tags/{tag} excludes drafts. Enumerating authenticated
          # releases finds Release Please's draft and remains fail-closed on API
          # errors because the shell has pipefail enabled.
          release_json=$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -sc --arg tag "$TAG" '
                  [.[] | .[] | select(.tag_name == $tag)]
                  | if length == 0 then empty
                    elif length == 1 then .[0]
                    else error("duplicate releases for tag " + $tag)
                    end'
          )
          if [ -z "$release_json" ]; then
            echo "Release Please draft for $TAG is missing; refusing split ownership." >&2
            exit 1
          fi

          mapfile -t existing_assets < <(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name'
          )
          mkdir -p existing-release-assets
          for asset in release-assets/*; do
            name=$(basename "$asset")
            if printf '%s\n' "${existing_assets[@]}" | grep -Fxq "$name"; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir existing-release-assets
              if ! cmp -s "$asset" "existing-release-assets/$name"; then
                echo "Release asset $name already exists with different bytes" >&2
                exit 1
              fi
            fi
          done

      - name: Attest verified artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Upload missing assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          SOURCE_SHA: ${{ needs.meta.outputs.source_sha }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail

          verify_tag_source() {
            local encoded_tag resolved_sha
            encoded_tag=$(jq -rn --arg tag "$TAG" '$tag | @uri')
            resolved_sha=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${encoded_tag}" --jq .sha)
            if [[ ! "$resolved_sha" =~ ^[0-9a-f]{40}$ ]] || \
               [ "$resolved_sha" != "$SOURCE_SHA" ]; then
              echo "Tag ${TAG} no longer resolves to release source ${SOURCE_SHA} (got ${resolved_sha:-invalid})" >&2
              exit 1
            fi
          }

          # Do not mutate a draft whose protected tag moved while the matrix ran.
          verify_tag_source
          mapfile -t existing_assets < <(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name'
          )
          for asset in release-assets/*; do
            name=$(basename "$asset")
            if printf '%s\n' "${existing_assets[@]}" | grep -Fxq "$name"; then
              echo "Release asset already identical: $name"
            else
              gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done

          mapfile -t expected_assets < <(
            find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          mapfile -t remote_assets < <(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | LC_ALL=C sort
          )
          if [ "${#expected_assets[@]}" -ne 13 ] || \
             [ "${#remote_assets[@]}" -ne 13 ] || \
             ! cmp -s \
               <(printf '%s\n' "${expected_assets[@]}") \
               <(printf '%s\n' "${remote_assets[@]}"); then
            echo "Draft must contain exactly the 13 expected release assets" >&2
            diff -u \
              <(printf '%s\n' "${expected_assets[@]}") \
              <(printf '%s\n' "${remote_assets[@]}") || true
            exit 1
          fi

          mkdir final-release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir final-release-assets
          mapfile -t downloaded_assets < <(
            find final-release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          if [ "${#downloaded_assets[@]}" -ne 13 ] || \
             ! cmp -s \
               <(printf '%s\n' "${expected_assets[@]}") \
               <(printf '%s\n' "${downloaded_assets[@]}"); then
            echo "Downloaded draft does not contain the exact expected asset set" >&2
            diff -u \
              <(printf '%s\n' "${expected_assets[@]}") \
              <(printf '%s\n' "${downloaded_assets[@]}") || true
            exit 1
          fi
          for name in "${downloaded_assets[@]}"; do
            if ! cmp -s "release-assets/$name" "final-release-assets/$name"; then
              echo "Final draft asset $name differs from the verified build output" >&2
              exit 1
            fi
          done

          # Publishing activates repository-level release immutability. Resolve
          # the tag one final time immediately before that irreversible boundary.
          verify_tag_source
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
               --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease="$PRERELEASE" --latest=false
          else
            actual_prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease --jq '.isPrerelease')
            test "$actual_prerelease" = "$PRERELEASE"
            echo "Release $TAG is already published and immutable."
          fi

  update-homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-24.04
    needs: [meta, publish]
    environment: updater-release
    timeout-minutes: 90
    # Every updater release writes the same tap.  Serialise the whole tap
    # transaction, not merely runs for one release tag.
    concurrency:
      group: snapdog-update-homebrew-tap
      cancel-in-progress: false
    # Stable releases only. A prerelease tag publishes assets but must not move
    # `brew install snapdogrocks/tap/snapdog-update` off the latest stable.
    if: needs.meta.outputs.prerelease == 'false'
    env:
      TAP_REPO: SnapDogRocks/homebrew-tap
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Split the tap coordinates
        id: tap
        run: |
          set -euo pipefail
          echo "owner=${TAP_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TAP_REPO##*/}" >> "$GITHUB_OUTPUT"

      # An installation token lives one hour. Opening the pull request fits
      # inside that; waiting for the tap's qualification afterwards may not, so
      # the merge mints a second one rather than stretching this one.
      - name: Mint a tap token for the pull request
        id: token-open
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ steps.tap.outputs.owner }}
          repositories: ${{ steps.tap.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
          permission-metadata: read

      - name: Verify the token and measure the identity the tap will see
        id: bot
        env:
          GH_TOKEN: ${{ steps.token-open.outputs.token }}
          APP_SLUG: ${{ steps.token-open.outputs.app-slug }}
        run: |
          set -euo pipefail
          mapfile -t reach < <(gh api /installation/repositories \
            --jq '.repositories[].full_name' | sort)
          printf 'the token reaches: %s\n' "${reach[*]:-nothing}"
          if [[ ${#reach[@]} -ne 1 || "${reach[0]}" != "$TAP_REPO" ]]; then
            echo "::error::TAP001 the tap token reaches ${#reach[@]} repositories, expected only ${TAP_REPO}"
            exit 1
          fi
          # The bot's own public user record. An installation token has no
          # personal user behind it, so /user would answer about nobody.
          login="${APP_SLUG}[bot]"
          id=$(gh api "/users/${login}" --jq .id)
          if [[ -z "$id" || "$id" == null ]]; then
            echo "::error::TAP002 no public user record for ${login}"
            exit 1
          fi
          echo "login=$login" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${login}@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Open a formula update pull request
        id: update
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token-open.outputs.token }}
          TAP_TOKEN: ${{ steps.token-open.outputs.token }}
          BOT_LOGIN: ${{ steps.bot.outputs.login }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
          OS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec 3>>"$GITHUB_OUTPUT"
          x64=$(sha256sum "artifacts/${TAG}-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)
          arm=$(sha256sum "artifacts/${TAG}-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" \
            "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"

          helper="$GITHUB_WORKSPACE/scripts/homebrew_updater.py"
          base_formula_sha=none
          base_version=none
          decision_file="$RUNNER_TEMP/homebrew-decision.json"
          if [[ -f Formula/snapdog-update.rb ]]; then
            base_formula_sha=$(sha256sum Formula/snapdog-update.rb | cut -d' ' -f1)
            decision=$(python3 "$helper" decision \
              --formula Formula/snapdog-update.rb --target-version "$VERSION")
            printf '%s\n' "$decision" > "$decision_file"
            base_version=$(jq -r '.current_version // "none"' "$decision_file")
            action=$(jq -r '.action' "$decision_file")
            case "$action" in
              noop)
                # Same-version runs still verify both URLs, both hashes and
                # version_scheme 1.  A bad formula must not be silently kept.
                python3 "$helper" validate --formula Formula/snapdog-update.rb \
                  --tag "$TAG" --version "$VERSION" --x86-sha "$x64" --arm-sha "$arm"
                echo "the tap already carries ${VERSION}; leaving it alone"
                echo "base_formula_sha=$base_formula_sha" >&3
                echo "base_version=$base_version" >&3
                echo 'pr=' >&3
                exit 0
                ;;
              stale)
                stale_tag=$(jq -r '.validation_tag' "$decision_file")
                stale_version=$(jq -r '.validation_version' "$decision_file")
                # A newer formula is also a no-op only after measuring its
                # published assets, not merely checking the digest syntax.
                release=$(GH_TOKEN="$OS_TOKEN" gh release view "$stale_tag" \
                  --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)
                jq -e '.isDraft == false and .isPrerelease == false' <<< "$release" >/dev/null
                stale_assets=$(mktemp -d "$RUNNER_TEMP/newer-updater.XXXXXX")
                GH_TOKEN="$OS_TOKEN" gh release download "$stale_tag" \
                  --repo "$GITHUB_REPOSITORY" --dir "$stale_assets" \
                  --pattern "${stale_tag}-x86_64-apple-darwin.tar.gz" \
                  --pattern "${stale_tag}-aarch64-apple-darwin.tar.gz"
                stale_x64=$(sha256sum "$stale_assets/${stale_tag}-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)
                stale_arm=$(sha256sum "$stale_assets/${stale_tag}-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)
                python3 "$helper" validate --formula Formula/snapdog-update.rb \
                  --tag "$stale_tag" --version "$stale_version" \
                  --x86-sha "$stale_x64" --arm-sha "$stale_arm"
                echo "the tap already carries newer ${stale_version}; leaving it alone"
                echo "base_formula_sha=$base_formula_sha" >&3
                echo "base_version=$base_version" >&3
                echo 'pr=' >&3
                exit 0
                ;;
              update|migrate) : ;;
              *) echo "::error::TAP003 unknown formula update decision: $action" >&2; exit 1 ;;
            esac
          fi

          install -d Formula
          cat > Formula/snapdog-update.rb <<EOF
          class SnapdogUpdate < Formula
            desc "Firmware update client for SnapDog OS"
            homepage "https://github.com/SnapDogRocks/snapdog-os"
            license "GPL-3.0-only"
            # The old tap used the OS release number (v0.16.6) for updater
            # archives.  Scheme 1 explicitly starts the independent updater
            # version stream (0.4.2) and must remain on all future formulas.
            version_scheme 1

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/SnapDogRocks/snapdog-os/releases/download/${TAG}/${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${x64}"
              else
                url "https://github.com/SnapDogRocks/snapdog-os/releases/download/${TAG}/${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${arm}"
              end
            end

            def install
              bin.install "snapdog-update"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/snapdog-update --version")
            end
          end
          EOF

          python3 "$helper" validate --formula Formula/snapdog-update.rb \
            --tag "$TAG" --version "$VERSION" --x86-sha "$x64" --arm-sha "$arm"

          if git ls-files --error-unmatch Formula/snapdog-update.rb >/dev/null 2>&1 \
              && git diff --quiet -- Formula/snapdog-update.rb; then
            echo "the formula is already current at ${VERSION}"
            echo 'pr=' >&3
            exit 0
          fi

          branch="release/snapdog-update-${VERSION}-${GITHUB_RUN_ID}"
          # Record the base before the push so merge can detect a tap change
          # while qualification runs.  Cleanup checks for an open PR first.
          echo "branch=$branch" >&3
          echo "base_formula_sha=$base_formula_sha" >&3
          echo "base_version=$base_version" >&3

          # A re-run has the same run id and therefore the same branch name.
          # Reuse it only when exactly one open PR targets main and its formula
          # is the verified candidate.  Any mismatch fails without deletion.
          existing_prs=$(gh pr list --repo "$TAP_REPO" --head "$branch" \
            --state open --json number,url,baseRefName,headRefName,headRefOid --limit 20)
          existing_count=$(jq 'length' <<< "$existing_prs")
          if [[ "$existing_count" -gt 1 ]]; then
            echo "::error::TAP008 multiple open PRs use ${branch}; refusing to choose one"
            exit 1
          elif [[ "$existing_count" == 1 ]]; then
            existing_base=$(jq -r '.[0].baseRefName' <<< "$existing_prs")
            existing_head=$(jq -r '.[0].headRefName' <<< "$existing_prs")
            existing_pr=$(jq -r '.[0].url' <<< "$existing_prs")
            existing_oid=$(jq -r '.[0].headRefOid' <<< "$existing_prs")
            if [[ "$existing_base" != main || "$existing_head" != "$branch" ]]; then
              echo "::error::TAP009 existing PR for ${branch} does not target main"
              exit 1
            fi
            existing_formula="$RUNNER_TEMP/existing-${GITHUB_RUN_ID}.rb"
            changed=$(gh pr diff "$existing_pr" --repo "$TAP_REPO" --name-only)
            if [[ "$changed" != Formula/snapdog-update.rb ]]; then
              echo "::error::TAP009 existing PR changes files outside the owned formula"
              exit 1
            fi
            gh api "repos/${TAP_REPO}/contents/Formula/snapdog-update.rb?ref=${existing_oid}" \
              --jq .content | base64 --decode > "$existing_formula"
            python3 "$helper" validate --formula "$existing_formula" \
              --tag "$TAG" --version "$VERSION" --x86-sha "$x64" --arm-sha "$arm"
            echo "reusing verified existing pull request ${existing_pr}"
            echo "pr=$existing_pr" >&3
            echo "head=$existing_oid" >&3
            exit 0
          fi

          if git ls-remote --exit-code --refs origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "::error::TAP010 branch ${branch} exists without a matching open PR; refusing to delete or reuse it"
            exit 1
          fi

          git switch -c "$branch"
          git config user.name "$BOT_LOGIN"
          git config user.email "$BOT_EMAIL"
          git add Formula/snapdog-update.rb
          git commit -m "snapdog-update ${VERSION}"
          git push -u origin "$branch"
          echo "new_branch_pushed=true" >&3
          pr=$(gh pr create --repo "$TAP_REPO" --base main --head "$branch" \
            --title "snapdog-update ${VERSION}" \
            --body "Automated update from the verified ${TAG} release assets. The formula is merged only after every tap qualification lane passes.")
          echo "pr=$pr" >&3
          # Recorded so the merge step can prove nothing was pushed onto the
          # branch while the qualification ran.
          echo "head=$(gh pr view "$pr" --repo "$TAP_REPO" --json headRefOid --jq .headRefOid)" >&3

      # An orphan is removable only after a fresh PR query proves that no open
      # PR uses the branch.  This protects an existing PR if create/output
      # failed after the remote branch was written.
      - name: Remove an orphaned branch from the tap
        if: failure() && steps.update.outputs.new_branch_pushed == 'true' && steps.update.outputs.pr == ''
        env:
          GH_TOKEN: ${{ steps.token-open.outputs.token }}
          BRANCH: ${{ steps.update.outputs.branch }}
        run: |
          set -euo pipefail
          open_prs=$(gh pr list --repo "$TAP_REPO" --head "$BRANCH" \
            --state open --json number)
          open_pr_count=$(jq 'length' <<< "$open_prs")
          if python3 "$GITHUB_WORKSPACE/scripts/homebrew_updater.py" \
              branch-cleanup-decision --open-pr-count "$open_pr_count"; then
            gh api -X DELETE "repos/${TAP_REPO}/git/refs/heads/${BRANCH}"
          else
            echo "retaining ${BRANCH}: an open PR still uses it"
          fi

      - name: Require tap qualification
        if: steps.update.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.token-open.outputs.token }}
          PR: ${{ steps.update.outputs.pr }}
        run: |
          set -euo pipefail
          # Exit 8 means checks are registered but still pending.  Use the JSON
          # payload to distinguish that state from an empty registration race.
          for attempt in {1..18}; do
            checks_json=$(gh pr checks "$PR" --repo "$TAP_REPO" \
              --json name,state,bucket 2>/dev/null || true)
            if python3 "$GITHUB_WORKSPACE/scripts/homebrew_updater.py" \
                checks-registered --payload "$checks_json"; then
              echo "tap checks registered (attempt ${attempt}); waiting for completion"
              break
            fi
            if [[ "$attempt" == 18 ]]; then
              echo "::error::TAP004 the tap reported no checks for $PR"
              exit 1
            fi
            sleep 10
          done
          # Bounded well inside the token's hour, so a stalled tap lane fails
          # here with a clear message instead of on an expired credential.
          timeout 45m gh pr checks "$PR" --repo "$TAP_REPO" \
            --watch --fail-fast --interval 20

      # The wait above may have consumed most of the first token's life, so the
      # merge uses a fresh one. Minted unconditionally: with an `if:` here the
      # read-back below would need a fallback expression, and a credential whose
      # origin only a reader can resolve is not a demonstrated origin.
      - name: Mint a tap token for the merge
        id: token-merge
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ steps.tap.outputs.owner }}
          repositories: ${{ steps.tap.outputs.repo }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
          permission-metadata: read

      - name: Recheck the head and the guard, then merge
        if: steps.update.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.token-merge.outputs.token }}
          PR: ${{ steps.update.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.update.outputs.head }}
          EXPECTED_BASE_FORMULA_SHA: ${{ steps.update.outputs.base_formula_sha }}
          EXPECTED_BASE_VERSION: ${{ steps.update.outputs.base_version }}
        run: |
          set -euo pipefail
          head=$(gh pr view "$PR" --repo "$TAP_REPO" --json headRefOid --jq .headRefOid)
          if [[ "$head" != "$EXPECTED_HEAD" ]]; then
            echo "::error::TAP005 the pull request head moved from ${EXPECTED_HEAD} to ${head} during qualification"
            exit 1
          fi

          # Re-read main immediately before the merge.  The serialized job
          # protects against our own releases; this check also catches an
          # operator or another bot changing the tap while qualification ran.
          main_formula="$RUNNER_TEMP/main-snapdog-update.rb"
          main_formula_b64="$RUNNER_TEMP/main-snapdog-update.rb.b64"
          main_formula_error="$RUNNER_TEMP/main-snapdog-update.rb.err"
          if gh api "repos/${TAP_REPO}/contents/Formula/snapdog-update.rb?ref=main" \
              --jq .content > "$main_formula_b64" 2> "$main_formula_error"; then
            base64 --decode < "$main_formula_b64" > "$main_formula"
          elif grep -q 'HTTP 404' "$main_formula_error"; then
            rm -f "$main_formula" "$main_formula_b64"
          else
            cat "$main_formula_error" >&2
            exit 1
          fi
          if [[ "$EXPECTED_BASE_FORMULA_SHA" == none ]]; then
            if [[ -e "$main_formula" ]]; then
              echo "::error::TAP011 Formula appeared on main while qualification ran"
              exit 1
            fi
          else
            if [[ ! -e "$main_formula" ]]; then
              echo "::error::TAP011 Formula disappeared from main while qualification ran"
              exit 1
            fi
            actual_base_sha=$(sha256sum "$main_formula" | cut -d' ' -f1)
            if [[ "$actual_base_sha" != "$EXPECTED_BASE_FORMULA_SHA" ]]; then
              echo "::error::TAP011 tap Formula changed while qualification ran"
              exit 1
            fi
            current_main_version=$(python3 "$GITHUB_WORKSPACE/scripts/homebrew_updater.py" \
              state --formula "$main_formula" | jq -r '.version')
            if [[ "$current_main_version" != "$EXPECTED_BASE_VERSION" ]]; then
              echo "::error::TAP011 tap version changed from ${EXPECTED_BASE_VERSION} to ${current_main_version} while qualification ran"
              exit 1
            fi
          fi

          # A ruleset can report a branch as protected while requiring only
          # deletion/non-fast-forward restrictions.  Require the active main
          # ruleset to enforce both a pull request and this exact qualification
          # check before merging.
          rulesets=$(gh api --paginate \
            "repos/${TAP_REPO}/rules/branches/main?per_page=100" \
            | jq -sc 'add')
          if ! jq -e '
            any(.[]?; .type == "pull_request")
            and any(.[]?;
              .type == "required_status_checks"
              and .parameters.strict_required_status_checks_policy == true
              and any((.parameters.required_status_checks // [])[]?;
                .context == "Formula qualification" and .integration_id == 15368)
            )
          ' <<< "$rulesets"; then
            echo "::error::TAP006 active main ruleset does not require a pull request and Formula qualification"
            exit 1
          fi
          gh pr merge "$PR" --repo "$TAP_REPO" --squash \
            --match-head-commit "$EXPECTED_HEAD" --delete-branch

      - name: Verify the formula now on protected main
        if: steps.update.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.token-merge.outputs.token }}
        run: |
          set -euo pipefail
          x64=$(sha256sum "artifacts/${TAG}-x86_64-apple-darwin.tar.gz" | cut -d' ' -f1)
          arm=$(sha256sum "artifacts/${TAG}-aarch64-apple-darwin.tar.gz" | cut -d' ' -f1)
          published="$RUNNER_TEMP/published-snapdog-update.rb"
          gh api "repos/${TAP_REPO}/contents/Formula/snapdog-update.rb?ref=main" \
            --jq .content | base64 --decode > "$published"
          python3 "$GITHUB_WORKSPACE/scripts/homebrew_updater.py" validate \
            --formula "$published" --tag "$TAG" --version "$VERSION" \
            --x86-sha "$x64" --arm-sha "$arm"
          printf 'the tap now serves snapdog-update %s\n' "$VERSION"
