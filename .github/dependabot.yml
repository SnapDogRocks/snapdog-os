version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions-dependencies:
        update-types:
          - minor
          - patch

  # An entry of its own: the toolchain affects every build and never shares a
  # pull request. `rust-toolchain` is missing from GitHub's ecosystem table but
  # is in the published schema (json.schemastore.org/dependabot-2.0.json).
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:05"
    target-branch: main
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    labels:
      - dependencies

  - package-ecosystem: cargo
    directory: /snapdog-ctrl
    schedule:
      interval: daily
    target-branch: main
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /snapdog-update
    schedule:
      interval: daily
    target-branch: main
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /snapdog-ctrl/webui
    schedule:
      interval: daily
    target-branch: main
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "eslint"
        versions: [">=10"]
    groups:
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /dev
    schedule:
      interval: daily
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
