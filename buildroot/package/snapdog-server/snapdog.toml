# SnapDog Server Configuration
# Edit via SnapDog Control (http://snapdog) or manually.

[system]
log_level = "info"
# /var/lib is tmpfs on this OS (wiped every boot) and DynamicUser=yes's implied
# ProtectSystem=strict only excludes it from the read-only sandbox via
# StateDirectory=, which for a dynamic user re-creates it fresh under
# /var/lib/private on every start anyway — no persistence either way. Use the
# real, persistent /data partition directly instead.
state_dir = "/data/snapdog/state"

[audio]
sample_rate = 48000
bit_depth = 16
channels = 2
source_conflict = "last_wins"
zone_switch_fade_ms = 300
source_switch_fade_ms = 300

[snapcast]
streaming_port = 1704
codec = "flac"
group_volume_mode = "relative"
unknown_clients = "accept"
managed = true

[mdns]
enabled = true
advertise_snapcast = false

[[zone]]
name = "Default Zone"
icon = "🔊"
