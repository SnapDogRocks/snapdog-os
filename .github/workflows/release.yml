# SnapDog OS artifact pipeline. Stable builds are rooted in an immutable
# Release Please tag; beta builds are an explicit operator action.
name: Release OS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  R2_BUCKET: snapdog-updates
  BUILDROOT_VERSION: "2025.02.16"
  RUST_TOOLCHAIN: "1.88.0"
  NODE_VERSION: "26.5.0"
  BOTO3_VERSION: "1.43.54"

jobs:
  release-meta:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Resolve version and channel
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          file=".release-please-manifest.json"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Expected stable root tag vX.Y.Z, got '$tag'" >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            source_sha="$GITHUB_SHA"
            if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Tag event did not provide an immutable commit SHA" >&2
              exit 1
            fi
            encoded_tag=$(jq -rn --arg ref "$tag" '$ref | @uri')
            resolved_sha=$(gh api "repos/${repo}/commits/${encoded_tag}" --jq '.sha')
            if [[ ! "$resolved_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Could not resolve stable tag '$tag' to an immutable commit" >&2
              exit 1
            fi
            if [ "$resolved_sha" != "$source_sha" ]; then
              echo "Tag $tag moved or does not match the triggering commit: $resolved_sha != $source_sha" >&2
              exit 1
            fi

            # The immutable tag and the root Release Please manifest must agree.
            # This rejects hand-made/mistyped tags before expensive image builds.
            manifest_version=$(gh api "repos/${repo}/contents/${file}?ref=${source_sha}" \
              -H "Accept: application/vnd.github.raw" | jq -r '."."')
            if [ "$manifest_version" != "$version" ]; then
              echo "Tag $tag does not match root manifest version $manifest_version" >&2
              exit 1
            fi

            {
              echo "tag_name=${tag}"
              echo "version=${version}"
              echo "channel=release"
              echo "source_sha=${source_sha}"
            } >> "$GITHUB_OUTPUT"
          else
            # Betas always build reviewed code from the current main branch. Do
            # not feed an arbitrary dispatch ref into jobs that hold signing keys.
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Beta releases must be dispatched from main, got '$GITHUB_REF'" >&2
              exit 1
            fi
            source_sha="$GITHUB_SHA"
            if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Dispatch event did not provide an immutable main commit" >&2
              exit 1
            fi

            # Explicit beta builds preview the next release. Prefer the pending
            # Release Please version; otherwise preview the next patch.
            stable=$(gh api "repos/${repo}/contents/${file}?ref=${source_sha}" \
              -H "Accept: application/vnd.github.raw" | jq -r '."."')
            pending_error=$(mktemp)
            if pending_document=$(gh api \
                "repos/${repo}/contents/${file}?ref=release-please--branches--main" \
                -H "Accept: application/vnd.github.raw" 2>"$pending_error"); then
              pending=$(jq -er '."." | strings' <<< "$pending_document")
            elif grep -q 'HTTP 404' "$pending_error"; then
              pending=""
            else
              cat "$pending_error" >&2
              rm -f "$pending_error"
              echo "Could not determine the pending Release Please version" >&2
              exit 1
            fi
            rm -f "$pending_error"
            if [ -n "$pending" ] && [ "$pending" != "null" ] && [ "$pending" != "$stable" ]; then
              next="$pending"
            else
              IFS=. read -r MA MI PA <<< "$stable"
              next="${MA}.${MI}.$((PA + 1))"
            fi

            if [[ ! "$stable" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || \
               [[ ! "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release Please returned invalid versions: stable=$stable next=$next" >&2
              exit 1
            fi

            python3 - "$stable" "$next" <<'PY'
          import sys

          stable = tuple(int(part) for part in sys.argv[1].split("."))
          upcoming = tuple(int(part) for part in sys.argv[2].split("."))
          if upcoming <= stable:
              raise SystemExit(
                  f"beta base {sys.argv[2]} must outrank stable {sys.argv[1]}"
              )
          PY

            {
              echo "tag_name="
              echo "version=${next}-beta.${GITHUB_RUN_NUMBER}"
              echo "channel=beta"
              echo "source_sha=${source_sha}"
            } >> "$GITHUB_OUTPUT"
          fi

  build-ctrl:
    name: Build snapdog-ctrl
    runs-on: ubuntu-24.04
    needs: release-meta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-meta.outputs.source_sha }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-unknown-linux-gnu
          rustup default "$RUST_TOOLCHAIN"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: snapdog-ctrl/webui/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: snapdog-ctrl
          key: aarch64-release

      - name: Install aarch64 linker
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Architectures:/d' /etc/apt/sources.list.d/ubuntu.sources
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: noble noble-updates\nComponents: main universe\nArchitectures: arm64\n' | sudo tee /etc/apt/sources.list.d/arm64-ports.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            libavahi-compat-libdnssd-dev:arm64

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
        run: |
          # npm ci (not install): install strictly from the lockfile and never
          # rewrite it. `npm install` reformats package-lock.json (optional-dep
          # libc metadata) under CI's npm, dirtying the tree before build.rs runs
          # `git describe --dirty`, which tagged the release binary `x.y.z-dirty`.
          cd snapdog-ctrl/webui && npm ci --prefer-offline && npm run build && cd ../..
          cd snapdog-ctrl && cargo build --locked --release --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/snapdog-ctrl ../snapdog-ctrl-binary

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapdog-ctrl-binary
          path: snapdog-ctrl-binary
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build-image:
    name: Build image (${{ matrix.board }})
    runs-on: ubuntu-24.04
    needs: [release-meta, build-ctrl]
    environment:
      name: ${{ needs.release-meta.outputs.channel == 'release' && 'stable' || 'beta' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        board: [pi3, pi4, pi5, zero2w]
    env:
      BR2_DL_DIR: ${{ github.workspace }}/.buildroot-cache/dl
      BR2_CCACHE_DIR: ${{ github.workspace }}/.buildroot-cache/ccache/${{ matrix.board }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 4G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-meta.outputs.source_sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapdog-ctrl-binary

      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Install image build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            e2fsprogs \
            fdisk \
            file \
            flex \
            gettext \
            git \
            jq \
            libarchive-tools \
            libssl-dev \
            locales \
            make \
            mtools \
            openssl \
            parted \
            patch \
            perl \
            python3 \
            rauc \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

      - name: Restore Buildroot source cache
        id: cache-buildroot-src
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ../buildroot-src
          key: buildroot-src-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('buildroot/scripts/patch-buildroot') }}

      - name: Restore Buildroot download cache
        id: cache-buildroot-dl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BR2_DL_DIR }}
          key: buildroot-dl-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ matrix.board }}-${{ hashFiles('buildroot/**/*.mk', 'buildroot/**/*.hash', 'buildroot/configs/override.conf', 'buildroot/scripts/patch-buildroot') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            buildroot-dl-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ matrix.board }}-${{ hashFiles('buildroot/**/*.mk', 'buildroot/**/*.hash', 'buildroot/configs/override.conf', 'buildroot/scripts/patch-buildroot') }}-
            buildroot-dl-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ matrix.board }}-
            buildroot-dl-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-

      - name: Restore Buildroot compiler cache
        id: cache-buildroot-ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BR2_CCACHE_DIR }}
          key: buildroot-ccache-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ matrix.board }}-${{ hashFiles('buildroot/**/*.mk', 'buildroot/**/*.hash', 'buildroot/configs/override.conf', 'buildroot/kernel.fragment', 'buildroot/scripts/patch-buildroot') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            buildroot-ccache-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ matrix.board }}-${{ hashFiles('buildroot/**/*.mk', 'buildroot/**/*.hash', 'buildroot/configs/override.conf', 'buildroot/kernel.fragment', 'buildroot/scripts/patch-buildroot') }}-
            buildroot-ccache-${{ runner.os }}-${{ env.BUILDROOT_VERSION }}-${{ matrix.board }}-

      - name: Setup buildroot
        run: |
          set -euo pipefail
          mkdir -p "$BR2_DL_DIR" "$BR2_CCACHE_DIR" "../buildroot-${{ matrix.board }}"
          make setup

      - name: Build
        run: |
          set -euo pipefail
          chmod 755 snapdog-ctrl-binary
          make BOARD=${{ matrix.board }} VERSION="${{ needs.release-meta.outputs.version }}" config
          make BOARD=${{ matrix.board }} VERSION="${{ needs.release-meta.outputs.version }}" build

      - name: Generate Buildroot legal manifest
        run: |
          set -euo pipefail
          cd ../buildroot
          make O="${{ github.workspace }}/../buildroot-${{ matrix.board }}" \
            BR2_EXTERNAL="${{ github.workspace }}/buildroot" \
            SNAPDOG_BOARD="${{ matrix.board }}" \
            legal-info

      - name: Report Buildroot cache usage
        if: always()
        run: |
          set -euo pipefail
          du -sh "$BR2_DL_DIR" "$BR2_CCACHE_DIR" 2>/dev/null || true
          if [ -x "../buildroot-${{ matrix.board }}/host/bin/ccache" ]; then
            "../buildroot-${{ matrix.board }}/host/bin/ccache" -s || true
          fi

      - name: Package
        id: package
        run: |
          set -euo pipefail
          test -n "${{ secrets.RAUC_CA_KEY_PEM }}" || { echo "Missing RAUC_CA_KEY_PEM secret" >&2; exit 1; }
          VERSION="${{ needs.release-meta.outputs.version }}"
          IMG="../buildroot-${{ matrix.board }}/images/sdcard.img"
          OUT="snapdog-os-${{ matrix.board }}-${VERSION}.img.gz"
          BUNDLE="snapdog-os-${{ matrix.board }}-${VERSION}.raucb"
          SBOM="snapdog-os-${{ matrix.board }}-${VERSION}-sbom.csv"
          CHECKSUMS="snapdog-os-${{ matrix.board }}-${VERSION}.sha256"
          IMAGE_METADATA="snapdog-os-${{ matrix.board }}-${VERSION}.image.json"

          test -s "$IMG"
          PARTITIONS=$(sfdisk -J "$IMG" | jq '.partitiontable.partitions | length')
          test "$PARTITIONS" -eq 4

          gzip -n -c "$IMG" > "$OUT"
          # Capture both representations while the raw image still exists. The
          # helper also decompresses OUT and refuses metadata for a mismatched or
          # corrupt gzip payload.
          python3 scripts/release_manifest.py board-metadata \
            --board "${{ matrix.board }}" \
            --version "$VERSION" \
            --raw-image "$IMG" \
            --compressed-image "$OUT" \
            --output "$IMAGE_METADATA"
          cp "../buildroot-${{ matrix.board }}/legal-info/manifest.csv" "$SBOM"

          # Generate RAUC bundle
          umask 077
          printf '%s\n' "${{ secrets.RAUC_CA_KEY_PEM }}" > rauc-ca.key.pem
          RAUC_KEY_FILE="$(pwd)/rauc-ca.key.pem" \
            buildroot/rauc/create-bundle.sh \
            "${{ matrix.board }}" "$VERSION" \
            "../buildroot-${{ matrix.board }}/images/rootfs.ext4" \
            "$BUNDLE"
          rm -f rauc-ca.key.pem

          sha256sum "$OUT" "$BUNDLE" "$SBOM" > "$CHECKSUMS"

          {
            echo "image=${OUT}"
            echo "bundle=${BUNDLE}"
            echo "sbom=${SBOM}"
            echo "checksums=${CHECKSUMS}"
            echo "image_metadata=${IMAGE_METADATA}"
          } >> "$GITHUB_OUTPUT"

      - name: Trim Buildroot compiler cache
        if: always()
        run: |
          set -euo pipefail
          if [ -x "../buildroot-${{ matrix.board }}/host/bin/ccache" ]; then
            "../buildroot-${{ matrix.board }}/host/bin/ccache" -M "$CCACHE_MAXSIZE" || true
            "../buildroot-${{ matrix.board }}/host/bin/ccache" -c || true
          fi

      - name: Save Buildroot download cache
        if: success() && steps.cache-buildroot-dl.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BR2_DL_DIR }}
          key: ${{ steps.cache-buildroot-dl.outputs.cache-primary-key }}

      - name: Save Buildroot compiler cache
        if: success() && steps.cache-buildroot-ccache.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BR2_CCACHE_DIR }}
          key: ${{ steps.cache-buildroot-ccache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.board }}
          path: |
            ${{ steps.package.outputs.image }}
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.sbom }}
            ${{ steps.package.outputs.checksums }}
            ${{ steps.package.outputs.image_metadata }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: [release-meta, build-image]
    outputs:
      channel_advanced: ${{ steps.freshness.outputs.advance }}
      redeploy: ${{ steps.freshness.outputs.redeploy }}
      release_published: ${{ steps.github_release.outputs.published }}
    environment:
      name: ${{ needs.release-meta.outputs.channel == 'release' && 'stable' || 'beta' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-meta.outputs.source_sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Install publish tools
        run: |
          set -euo pipefail
          if ! aws --version 2>/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp && sudo /tmp/aws/install
          fi
          python3 -m venv /tmp/r2venv
          /tmp/r2venv/bin/pip install --quiet "boto3==${BOTO3_VERSION}"

      # GitHub concurrency groups are not FIFO: a third run replaces an older
      # pending run. R2's conditional-write lease queues every mutator without
      # silently dropping releases.
      - name: Acquire R2 mutation lock
        timeout-minutes: 300
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo "Missing R2_ACCESS_KEY_ID" >&2; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY:-}" || { echo "Missing R2_SECRET_ACCESS_KEY" >&2; exit 1; }
          test -n "${AWS_ENDPOINT_URL:-}" || { echo "Missing R2_ENDPOINT_URL" >&2; exit 1; }
          owner="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_JOB}:${RANDOM}:$(date +%s%N)"
          printf '%s\n' "$owner" > /tmp/r2-lock-owner
          /tmp/r2venv/bin/python tools/r2_lock.py acquire \
            --owner "$owner" --ttl-seconds 7200 --wait-seconds 18000

      # A stable and a manually requested beta can finish in either order. This
      # check runs inside the serialized R2 publish job and makes the beta pointer
      # monotonic: an older preview can never overwrite a newer beta or release.
      - name: Check channel freshness
        id: freshness
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
          CANDIDATE_VERSION: ${{ needs.release-meta.outputs.version }}
          CHANNEL: ${{ needs.release-meta.outputs.channel }}
          SOURCE_SHA: ${{ needs.release-meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          source scripts/r2_helpers.sh

          CURRENT_RELEASE=""
          CURRENT_RELEASE_COMMIT=""
          if r2_get_optional \
              "s3://${R2_BUCKET}/os/images/latest-release.json" current-release.json; then
            CURRENT_RELEASE=$(jq -r '.version // ""' current-release.json)
            CURRENT_RELEASE_COMMIT=$(jq -r '.commit // ""' current-release.json)
          else
            status=$?
            [ "$status" -eq "$R2_OPTIONAL_MISSING" ] || exit "$status"
          fi
          CURRENT_BETA=""
          CURRENT_BETA_COMMIT=""
          if r2_get_optional \
              "s3://${R2_BUCKET}/os/images/latest-beta.json" current-beta.json; then
            CURRENT_BETA=$(jq -r '.version // ""' current-beta.json)
            CURRENT_BETA_COMMIT=$(jq -r '.commit // ""' current-beta.json)
          else
            status=$?
            [ "$status" -eq "$R2_OPTIONAL_MISSING" ] || exit "$status"
          fi

          VERSION_EXISTS=false
          if r2_get_optional \
              "s3://${R2_BUCKET}/os/images/manifests/${CHANNEL}/${CANDIDATE_VERSION}.json" \
              candidate-manifest.json; then
            python3 scripts/release_manifest.py validate \
              --manifest candidate-manifest.json
            test "$(jq -r '.channel' candidate-manifest.json)" = "$CHANNEL"
            test "$(jq -r '.version' candidate-manifest.json)" = "$CANDIDATE_VERSION"
            test "$(jq -r '.commit' candidate-manifest.json)" = "$SOURCE_SHA"
            VERSION_EXISTS=true
          else
            status=$?
            [ "$status" -eq "$R2_OPTIONAL_MISSING" ] || exit "$status"
          fi

          POINTER_EXISTS=false
          if [ "$VERSION_EXISTS" != "true" ]; then
            if [ "$CHANNEL" = "release" ] && \
               [ "$CURRENT_RELEASE" = "$CANDIDATE_VERSION" ] && \
               [ "$CURRENT_RELEASE_COMMIT" = "$SOURCE_SHA" ]; then
              cp current-release.json candidate-manifest.json
              POINTER_EXISTS=true
            elif [ "$CHANNEL" = "beta" ] && \
                 [ "$CURRENT_BETA" = "$CANDIDATE_VERSION" ] && \
                 [ "$CURRENT_BETA_COMMIT" = "$SOURCE_SHA" ]; then
              cp current-beta.json candidate-manifest.json
              POINTER_EXISTS=true
            fi
          fi

          mapfile -t DECISION < <(python3 - \
            "$CANDIDATE_VERSION" "$CHANNEL" "$SOURCE_SHA" \
            "$CURRENT_RELEASE" "$CURRENT_RELEASE_COMMIT" \
            "$CURRENT_BETA" "$CURRENT_BETA_COMMIT" <<'PY'
          import re
          import sys

          pattern = re.compile(r"^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$")

          def semver_key(value: str) -> tuple[int, int, int, int, int]:
              match = pattern.fullmatch(value)
              if not match:
                  raise SystemExit(f"invalid channel version: {value!r}")
              major, minor, patch = (int(part) for part in match.group(1, 2, 3))
              beta = match.group(4)
              # A stable release sorts after every prerelease of the same core.
              return (major, minor, patch, 1 if beta is None else 0, int(beta or 0))

          candidate, channel, source, release, release_commit, beta, beta_commit = sys.argv[1:]
          candidate_key = semver_key(candidate)
          if release and "-" in release:
              raise SystemExit(f"release channel is not stable: {release!r}")

          if channel == "release":
              if "-" in candidate:
                  raise SystemExit(f"stable candidate is not stable: {candidate!r}")
              repair_beta = (
                  "true"
                  if not beta or candidate_key >= semver_key(beta)
                  else "false"
              )
              if not release or candidate_key > semver_key(release):
                  decision = (
                      "true", "true", "true", repair_beta, "true",
                      "new stable release"
                  )
              elif candidate_key < semver_key(release):
                  # Finish immutable/history assets without moving rolling aliases.
                  decision = (
                      "true", "false", "false", "false", "false",
                      "historical stable release"
                  )
              else:
                  if release_commit != source:
                      raise SystemExit(
                          "stable version already points at a different commit: "
                          f"{release_commit!r} != {source!r}"
                      )
                  # A retry may need to repair beta stable-plus or the web hook
                  # after latest-release.json was already committed.
                  decision = (
                      "true", "false", "true", repair_beta, "true",
                      "repair current stable release"
                  )
          elif channel == "beta":
              if "-beta." not in candidate:
                  raise SystemExit(f"beta candidate is not a beta: {candidate!r}")
              current = max(
                  (semver_key(value) for value in (release, beta) if value),
                  default=(-1, -1, -1, -1, -1),
              )
              if beta and candidate_key == semver_key(beta):
                  if beta_commit != source:
                      raise SystemExit(
                          "beta version already points at a different commit: "
                          f"{beta_commit!r} != {source!r}"
                      )
                  decision = (
                      "true", "false", "false", "false", "true",
                      "repair current beta"
                  )
              elif candidate_key > current:
                  decision = (
                      "true", "true", "false", "false", "true", "new beta"
                  )
              else:
                  decision = (
                      "false", "false", "false", "false", "false",
                      "beta already superseded"
                  )
          else:
              raise SystemExit(f"unsupported channel: {channel!r}")

          print(*decision, sep="\n")
          PY
          )
          PUBLISH=${DECISION[0]}
          ADVANCE=${DECISION[1]}
          REDEPLOY=${DECISION[2]}
          REPAIR_BETA=${DECISION[3]}
          CUTOVER_ACTIVE=${DECISION[4]}
          REASON=${DECISION[5]}
          {
            echo "publish=$PUBLISH"
            echo "advance=$ADVANCE"
            echo "redeploy=$REDEPLOY"
            echo "repair_beta=$REPAIR_BETA"
            echo "cutover_active=$CUTOVER_ACTIVE"
            echo "version_exists=$VERSION_EXISTS"
            echo "pointer_exists=$POINTER_EXISTS"
          } >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "true" ]; then
            echo "Publishing $CHANNEL $CANDIDATE_VERSION: $REASON"
          else
            echo "Skipping R2 mutation for $CHANNEL $CANDIDATE_VERSION: $REASON"
          fi

      - name: Stage canonical artifacts in Cloudflare R2
        if: steps.freshness.outputs.publish == 'true'
        timeout-minutes: 90
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
          VERSION_EXISTS: ${{ steps.freshness.outputs.version_exists }}
          POINTER_EXISTS: ${{ steps.freshness.outputs.pointer_exists }}
        run: |
          set -euo pipefail
          source scripts/r2_helpers.sh
          owner=$(cat /tmp/r2-lock-owner)
          /tmp/r2venv/bin/python tools/r2_lock.py renew \
            --owner "$owner" --ttl-seconds 7200

          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo "Missing R2_ACCESS_KEY_ID"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY:-}" || { echo "Missing R2_SECRET_ACCESS_KEY"; exit 1; }
          test -n "${AWS_ENDPOINT_URL:-}" || { echo "Missing R2_ENDPOINT_URL"; exit 1; }

          # Version + channel are decided once in the metadata job (SSOT).
          # This step publishes the ACTIVE channel; a release additionally advances
          # the beta pointer (see "Advance beta pointer to release" below) so beta
          # stays "stable-plus" (always >= the latest release).
          VERSION="${{ needs.release-meta.outputs.version }}"
          CHANNEL="${{ needs.release-meta.outputs.channel }}"

          IMAGE_METADATA=()
          for board in pi3 pi4 pi5 zero2w; do
            IMAGE="artifacts/image-${board}/snapdog-os-${board}-${VERSION}.img.gz"
            BUNDLE="artifacts/image-${board}/snapdog-os-${board}-${VERSION}.raucb"
            SBOM="artifacts/image-${board}/snapdog-os-${board}-${VERSION}-sbom.csv"
            CHECKSUMS="artifacts/image-${board}/snapdog-os-${board}-${VERSION}.sha256"
            METADATA="artifacts/image-${board}/snapdog-os-${board}-${VERSION}.image.json"

            test -s "$IMAGE"
            test -s "$BUNDLE"
            test -s "$SBOM"
            test -s "$CHECKSUMS"
            test -s "$METADATA"
            (cd "artifacts/image-${board}" && sha256sum --check "snapdog-os-${board}-${VERSION}.sha256")
            IMAGE_METADATA+=("$METADATA")
          done

          # Validate the complete channel manifest before changing any R2
          # object. A bad or incomplete board artifact must never leave rolling
          # image aliases ahead of their manifest.
          python3 scripts/release_manifest.py manifest \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --commit "${{ needs.release-meta.outputs.source_sha }}" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --base-url "https://updates.snapdog.cc/os/images" \
            --bundle-base-url "https://updates.snapdog.cc/os/bundles" \
            --metadata "${IMAGE_METADATA[@]}" \
            --output latest.json
          python3 scripts/release_manifest.py validate --manifest latest.json

          REFERENCE_EXISTS=false
          if [ "$VERSION_EXISTS" = "true" ] || [ "$POINTER_EXISTS" = "true" ]; then
            REFERENCE_EXISTS=true
            # The version manifest is the commit marker for all immutable
            # objects. A legacy/current pointer without that marker is treated
            # as committed too. Reruns may repair metadata, never replace bytes.
            python3 scripts/release_manifest.py validate \
              --manifest candidate-manifest.json
            cp candidate-manifest.json latest.json
          fi

          upload_immutable() {
            local source=$1
            local destination=$2
            local status
            if [ "$REFERENCE_EXISTS" != "true" ]; then
              # No manifest or public pointer commits this set yet. Replace any
              # markerless debris left by an interrupted attempt under the lock.
              aws s3 cp "$source" "$destination" \
                --cache-control "public, max-age=31536000, immutable" \
                --endpoint-url "$AWS_ENDPOINT_URL"
              return
            fi

            # Once a manifest or channel pointer commits the version, R2 is the
            # canonical byte source. Adopt it locally so nondeterministic RAUC
            # signatures cannot split rerun attestations/GitHub assets from R2.
            if r2_get_optional "$destination" "$source"; then
              echo "Adopted committed immutable object: $destination"
              return 0
            else
              status=$?
            fi
            if [ "$status" -eq "$R2_OPTIONAL_MISSING" ]; then
              echo "Committed immutable object is missing: $destination" >&2
              return 1
            fi
            return "$status"
          }

          for board in pi3 pi4 pi5 zero2w; do
            IMAGE="artifacts/image-${board}/snapdog-os-${board}-${VERSION}.img.gz"
            BUNDLE="artifacts/image-${board}/snapdog-os-${board}-${VERSION}.raucb"
            SBOM="artifacts/image-${board}/snapdog-os-${board}-${VERSION}-sbom.csv"

            upload_immutable "$IMAGE" \
              "s3://${R2_BUCKET}/os/images/snapdog-os-${board}-${VERSION}.img.gz"
            upload_immutable "$BUNDLE" \
              "s3://${R2_BUCKET}/os/bundles/snapdog-os-${board}-${VERSION}.raucb"
            upload_immutable "$SBOM" \
              "s3://${R2_BUCKET}/os/sbom/snapdog-os-${board}-${VERSION}-sbom.csv"

            if [ "$REFERENCE_EXISTS" = "true" ]; then
              expected_sha=$(jq -r --arg board "$board" \
                '.boards[$board].sha256' latest.json)
              expected_size=$(jq -r --arg board "$board" \
                '.boards[$board].compressed_size' latest.json)
              test "$(sha256sum "$IMAGE" | cut -d' ' -f1)" = "$expected_sha"
              test "$(stat -c '%s' "$IMAGE")" = "$expected_size"
              (cd "artifacts/image-${board}" && \
                sha256sum \
                  "snapdog-os-${board}-${VERSION}.img.gz" \
                  "snapdog-os-${board}-${VERSION}.raucb" \
                  "snapdog-os-${board}-${VERSION}-sbom.csv" \
                  > "snapdog-os-${board}-${VERSION}.sha256")
            fi
          done

          # Preserve the complete validated manifest under an immutable key and
          # merge it into the bounded channel catalog. Installer clients can
          # therefore offer real version selection without scraping GitHub tags
          # or guessing integrity metadata from filenames.
          CATALOG="catalog-${CHANNEL}.json"
          VERSION_MANIFEST_CACHE="public, max-age=31536000, immutable"
          if [ "$CHANNEL" = "beta" ]; then
            VERSION_MANIFEST_CACHE="public, max-age=86400, immutable"
          fi
          PREVIOUS_ARGS=()
          if r2_get_optional \
              "s3://${R2_BUCKET}/os/images/${CATALOG}" previous-catalog.json; then
            PREVIOUS_ARGS=(--previous previous-catalog.json)
          else
            status=$?
            [ "$status" -eq "$R2_OPTIONAL_MISSING" ] || exit "$status"
          fi
          python3 scripts/release_manifest.py catalog \
            --channel "$CHANNEL" \
            --manifest latest.json \
            "${PREVIOUS_ARGS[@]}" \
            --output "$CATALOG"
          python3 scripts/release_manifest.py validate-catalog --catalog "$CATALOG"
          if [ "$VERSION_EXISTS" != "true" ]; then
            # Commit marker is written only after all immutable objects exist.
            aws s3 cp latest.json \
              "s3://${R2_BUCKET}/os/images/manifests/${CHANNEL}/${VERSION}.json" \
              --cache-control "$VERSION_MANIFEST_CACHE" \
              --content-type "application/json" \
              --endpoint-url "$AWS_ENDPOINT_URL"
          fi
          echo "Staged immutable $CHANNEL $VERSION; public pointers are unchanged."

      # Prepare stable-plus metadata without exposing it. The critical cutover
      # below publishes beta before release so beta subscribers are never behind.
      - name: Stage stable-plus beta metadata
        if: needs.release-meta.outputs.channel == 'release' && steps.freshness.outputs.repair_beta == 'true'
        timeout-minutes: 20
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          source scripts/r2_helpers.sh
          owner=$(cat /tmp/r2-lock-owner)
          /tmp/r2venv/bin/python tools/r2_lock.py renew \
            --owner "$owner" --ttl-seconds 7200
          REL="${{ needs.release-meta.outputs.version }}"

          if [ ! -f latest.json ]; then
            test -s candidate-manifest.json
            cp candidate-manifest.json latest.json
          fi
          python3 scripts/release_manifest.py validate --manifest latest.json

          # Beta manifest mirrors the release manifest (written by the previous
          # step as latest.json), with channel + image filenames rewritten to the
          # beta aliases. Same bytes → the release shas stay valid.
          jq '.channel = "beta"
              | .boards |= with_entries(.value.image |= sub("-release\\."; "-beta."))' \
            latest.json > latest-beta.json
          python3 scripts/release_manifest.py validate --manifest latest-beta.json

          BETA_VERSION_EXISTS=false
          if r2_get_optional \
              "s3://${R2_BUCKET}/os/images/manifests/beta/${REL}.json" \
              beta-version.json; then
            python3 scripts/release_manifest.py validate --manifest beta-version.json
            jq -S 'del(.date)' latest-beta.json > local-beta-semantic.json
            jq -S 'del(.date)' beta-version.json > remote-beta-semantic.json
            if ! cmp -s local-beta-semantic.json remote-beta-semantic.json; then
              diff -u remote-beta-semantic.json local-beta-semantic.json || true
              echo "Immutable beta manifest for release $REL already differs" >&2
              exit 1
            fi
            cp beta-version.json latest-beta.json
            BETA_VERSION_EXISTS=true
          else
            status=$?
            [ "$status" -eq "$R2_OPTIONAL_MISSING" ] || exit "$status"
          fi
          # Shipping a stable version supersedes every prerelease of that same
          # version. Preserve any already-staged future beta; retention removes
          # only entries whose payloads became obsolete with this stable.
          PREVIOUS_BETA_ARGS=()
          if r2_get_optional \
              "s3://${R2_BUCKET}/os/images/catalog-beta.json" \
              previous-beta-catalog.json; then
            PREVIOUS_BETA_ARGS=(--previous previous-beta-catalog.json)
          else
            status=$?
            [ "$status" -eq "$R2_OPTIONAL_MISSING" ] || exit "$status"
          fi
          python3 scripts/release_manifest.py catalog \
            --channel beta \
            --manifest latest-beta.json \
            "${PREVIOUS_BETA_ARGS[@]}" \
            --output catalog-beta.json
          python3 scripts/release_manifest.py validate-catalog \
            --catalog catalog-beta.json
          if [ "$BETA_VERSION_EXISTS" != "true" ]; then
            aws s3 cp latest-beta.json \
              "s3://${R2_BUCKET}/os/images/manifests/beta/${REL}.json" \
              --cache-control "public, max-age=86400, immutable" \
              --content-type "application/json" \
              --endpoint-url "$AWS_ENDPOINT_URL"
          fi
          echo "Staged stable-plus beta metadata for $REL; pointers are unchanged."

      - name: Attest verified artifacts
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/**/*.img.gz
            artifacts/**/*.raucb
            artifacts/**/*-sbom.csv
            artifacts/**/*.sha256

      - name: Prepare and verify GitHub release draft
        if: needs.release-meta.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.release-meta.outputs.source_sha }}
          TAG: ${{ needs.release-meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          encoded_tag=$(jq -rn --arg ref "$TAG" '$ref | @uri')
          resolved_sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${encoded_tag}" --jq '.sha')
          test "$resolved_sha" = "$SOURCE_SHA"

          mapfile -t release_files < <(find artifacts -type f \( \
            -name '*.img.gz' -o \
            -name '*.raucb' -o \
            -name '*-sbom.csv' -o \
            -name '*.sha256' \
          \) | sort)
          test "${#release_files[@]}" -eq 16

          printf '%s\n' "${release_files[@]##*/}" | sort > expected-os-assets.txt
          test "$(sort -u expected-os-assets.txt | wc -l)" -eq 16

          # The release-by-tag REST endpoint excludes drafts. Enumerate the
          # authenticated release collection so Release Please's draft is found,
          # while transport/auth failures still fail closed via pipefail.
          release_json=$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -sc --arg tag "$TAG" '
                  [.[] | .[] | select(.tag_name == $tag)]
                  | if length == 0 then empty
                    elif length == 1 then .[0]
                    else error("duplicate releases for tag " + $tag)
                    end'
          )
          if [ -z "$release_json" ]; then
            echo "Release Please draft for $TAG is missing; refusing split ownership." >&2
            exit 1
          fi

          mapfile -t existing_assets < <(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name'
          )
          mkdir -p existing-release-assets
          for release_file in "${release_files[@]}"; do
            name=$(basename "$release_file")
            if printf '%s\n' "${existing_assets[@]}" | grep -Fxq "$name"; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir existing-release-assets
              if ! cmp -s "$release_file" "existing-release-assets/$name"; then
                echo "GitHub release asset $name already exists with different bytes" >&2
                exit 1
              fi
              echo "GitHub release asset already identical: $name"
            else
              gh release upload "$TAG" "$release_file" --repo "$GITHUB_REPOSITORY"
            fi
          done

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > remote-os-assets.txt
          diff -u expected-os-assets.txt remote-os-assets.txt
          rm -rf verified-release-assets
          mkdir verified-release-assets
          while IFS= read -r name; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$name" --dir verified-release-assets
            local_path=$(find artifacts -type f -name "$name" -print -quit)
            test -n "$local_path"
            cmp "$local_path" "verified-release-assets/$name"
          done < expected-os-assets.txt

      # Object stores cannot atomically replace a cached manifest and eight
      # compatibility aliases. Neutralize aliases first, exhaust their old
      # cache lifetime, publish beta before release, then restore aliases only
      # after old manifest caches have expired. Legacy clients may retry during
      # this bounded window, but can never install bytes for the wrong version.
      - name: Commit public R2 metadata and aliases
        id: cutover
        if: steps.freshness.outputs.publish == 'true'
        timeout-minutes: 30
        env:
          ACTIVE_CUTOVER: ${{ steps.freshness.outputs.cutover_active }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
          CHANNEL: ${{ needs.release-meta.outputs.channel }}
          REPAIR_BETA: ${{ steps.freshness.outputs.repair_beta }}
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          owner=$(cat /tmp/r2-lock-owner)
          /tmp/r2venv/bin/python tools/r2_lock.py renew \
            --owner "$owner" --ttl-seconds 7200

          python3 scripts/release_manifest.py validate --manifest latest.json
          python3 scripts/release_manifest.py validate-catalog \
            --catalog "catalog-${CHANNEL}.json"
          aws s3 cp "catalog-${CHANNEL}.json" \
            "s3://${R2_BUCKET}/os/images/catalog-${CHANNEL}.json" \
            --cache-control "public, max-age=60" \
            --content-type "application/json" \
            --endpoint-url "$AWS_ENDPOINT_URL"

          if [ "$REPAIR_BETA" = "true" ]; then
            python3 scripts/release_manifest.py validate --manifest latest-beta.json
            python3 scripts/release_manifest.py validate-catalog \
              --catalog catalog-beta.json
            aws s3 cp catalog-beta.json \
              "s3://${R2_BUCKET}/os/images/catalog-beta.json" \
              --cache-control "public, max-age=60" \
              --content-type "application/json" \
              --endpoint-url "$AWS_ENDPOINT_URL"
          fi

          cutover_channels=()
          if [ "$ACTIVE_CUTOVER" = "true" ]; then
            cutover_channels+=("$CHANNEL")
          fi
          if [ "$REPAIR_BETA" = "true" ] && [ "$CHANNEL" != "beta" ]; then
            cutover_channels+=(beta)
          fi
          if [ "${#cutover_channels[@]}" -eq 0 ]; then
            echo "Published historical $CHANNEL $VERSION without moving its pointer."
            exit 0
          fi

          printf '%s\n' \
            "SnapDog update alias temporarily unavailable during an atomic cutover." \
            > /tmp/snapdog-alias-transition
          for target_channel in "${cutover_channels[@]}"; do
            for board in pi3 pi4 pi5 zero2w; do
              for destination in \
                "os/bundles/snapdog-os-${board}-${target_channel}.raucb" \
                "os/images/snapdog-os-${board}-${target_channel}.img.gz"; do
                aws s3 cp /tmp/snapdog-alias-transition \
                  "s3://${R2_BUCKET}/${destination}" \
                  --cache-control "no-store, max-age=0" \
                  --content-type "application/octet-stream" \
                  --endpoint-url "$AWS_ENDPOINT_URL"
              done
            done
          done

          echo "Waiting for every previously cacheable legacy alias to expire…"
          sleep 310
          /tmp/r2venv/bin/python tools/r2_lock.py renew \
            --owner "$owner" --ttl-seconds 7200

          # Stable-plus is committed first. During a stable rollout this keeps
          # latest-beta >= latest-release at every externally visible instant.
          if [ "$REPAIR_BETA" = "true" ]; then
            aws s3 cp latest-beta.json \
              "s3://${R2_BUCKET}/os/images/latest-beta.json" \
              --cache-control "public, max-age=60" \
              --content-type "application/json" \
              --endpoint-url "$AWS_ENDPOINT_URL"
            echo "Waiting until the stable-plus beta pointer is visible everywhere…"
            sleep 70
            /tmp/r2venv/bin/python tools/r2_lock.py renew \
              --owner "$owner" --ttl-seconds 7200
          fi
          if [ "$ACTIVE_CUTOVER" = "true" ]; then
            aws s3 cp latest.json \
              "s3://${R2_BUCKET}/os/images/latest-${CHANNEL}.json" \
              --cache-control "public, max-age=60" \
              --content-type "application/json" \
              --endpoint-url "$AWS_ENDPOINT_URL"
          fi

          echo "Waiting for old channel-manifest caches to expire…"
          sleep 70
          /tmp/r2venv/bin/python tools/r2_lock.py renew \
            --owner "$owner" --ttl-seconds 7200

          alias_args=()
          for target_channel in "${cutover_channels[@]}"; do
            alias_args+=(--channel "$target_channel")
          done
          # One implementation owns normal publication and recovery. It
          # exact-matches each committed manifest, preflights every source, and
          # verifies every completed alias copy before the release can publish.
          /tmp/r2venv/bin/python tools/r2_repair_aliases.py \
            --apply "${alias_args[@]}"

      - name: Recover compatibility aliases after a failed cutover
        if: ${{ always() && (steps.cutover.outcome == 'failure' || steps.cutover.outcome == 'cancelled') }}
        timeout-minutes: 10
        env:
          ACTIVE_CUTOVER: ${{ steps.freshness.outputs.cutover_active }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
          CHANNEL: ${{ needs.release-meta.outputs.channel }}
          REPAIR_BETA: ${{ steps.freshness.outputs.repair_beta }}
        run: |
          set -euo pipefail
          owner=$(cat /tmp/r2-lock-owner)
          /tmp/r2venv/bin/python tools/r2_lock.py renew \
            --owner "$owner" --ttl-seconds 7200

          recovery_args=()
          if [ "$ACTIVE_CUTOVER" = "true" ]; then
            recovery_args+=(--channel "$CHANNEL")
          fi
          if [ "$REPAIR_BETA" = "true" ] && [ "$CHANNEL" != "beta" ]; then
            recovery_args+=(--channel beta)
          fi
          if [ "${#recovery_args[@]}" -gt 0 ]; then
            # The shared helper requires an exact committed version manifest,
            # verifies source objects, waits out fresh pointer caches, and then
            # restores only aliases derived from that authoritative state.
            /tmp/r2venv/bin/python tools/r2_repair_aliases.py \
              --apply "${recovery_args[@]}"
          fi

      - name: Publish verified GitHub releases
        id: github_release
        if: needs.release-meta.outputs.channel == 'release'
        timeout-minutes: 90
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          GH_TOKEN: ${{ github.token }}
          MAKE_LATEST: ${{ steps.freshness.outputs.redeploy }}
          SOURCE_SHA: ${{ needs.release-meta.outputs.source_sha }}
          TAG: ${{ needs.release-meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          owner=$(cat /tmp/r2-lock-owner)
          /tmp/r2venv/bin/python tools/r2_lock.py renew \
            --owner "$owner" --ttl-seconds 7200
          encoded_tag=$(jq -rn --arg ref "$TAG" '$ref | @uri')
          resolved_sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${encoded_tag}" --jq '.sha')
          test "$resolved_sha" = "$SOURCE_SHA"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > final-remote-os-assets.txt
          diff -u expected-os-assets.txt final-remote-os-assets.txt
          rm -rf final-release-assets
          mkdir final-release-assets
          while IFS= read -r name; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$name" --dir final-release-assets
            local_path=$(find artifacts -type f -name "$name" -print -quit)
            test -n "$local_path"
            cmp "$local_path" "final-release-assets/$name"
          done < expected-os-assets.txt

          # Component releases are drafts until their owning artifact flow is
          # complete. snapdog-ctrl ships inside the OS, so publish its draft now.
          CTRL_VERSION=$(jq -er '."snapdog-ctrl" | strings' .release-please-manifest.json)
          CTRL_TAG="snapdog-ctrl-v${CTRL_VERSION}"
          ctrl_release_json=$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -sc --arg tag "$CTRL_TAG" '
                  [.[] | .[] | select(.tag_name == $tag)]
                  | if length == 0 then empty
                    elif length == 1 then .[0]
                    else error("duplicate releases for tag " + $tag)
                    end'
          )
          if [ -n "$ctrl_release_json" ] && \
             [ "$(jq -r '.draft' <<< "$ctrl_release_json")" = "true" ]; then
            encoded_ctrl_tag=$(jq -rn --arg ref "$CTRL_TAG" '$ref | @uri')
            ctrl_sha=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${encoded_ctrl_tag}" --jq '.sha')
            if [ "$ctrl_sha" = "$SOURCE_SHA" ]; then
              gh release edit "$CTRL_TAG" --repo "$GITHUB_REPOSITORY" \
                --draft=false --latest=false
            else
              echo "Leaving older snapdog-ctrl draft $CTRL_TAG for its owning run ($ctrl_sha)."
            fi
          fi

          # Fence the irreversible publication/Latest edit after the potentially
          # large verification downloads as well as before them.
          /tmp/r2venv/bin/python tools/r2_lock.py renew \
            --owner "$owner" --ttl-seconds 7200
          latest_arg="--latest=false"
          if [ "$MAKE_LATEST" = "true" ]; then
            latest_arg="--latest"
          fi
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
               --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false "$latest_arg"
          else
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease --jq '.isPrerelease')" = "false"
            if [ "$MAKE_LATEST" = "true" ] && \
               [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
                    --jq '.tag_name')" != "$TAG" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
            fi
            echo "GitHub release $TAG is already published and immutable."
          fi
          if [ "$MAKE_LATEST" = "true" ]; then
            test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '.tag_name')" = "$TAG"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Prune superseded betas from R2
        if: steps.freshness.outputs.cutover_active == 'true' || steps.freshness.outputs.repair_beta == 'true'
        timeout-minutes: 20
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          owner=$(cat /tmp/r2-lock-owner)
          /tmp/r2venv/bin/python tools/r2_lock.py renew \
            --owner "$owner" --ttl-seconds 7200
          /tmp/r2venv/bin/python tools/r2_maintenance.py --apply

      - name: Release R2 mutation lock
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          if [ -s /tmp/r2-lock-owner ] && [ -x /tmp/r2venv/bin/python ]; then
            owner=$(cat /tmp/r2-lock-owner)
            /tmp/r2venv/bin/python tools/r2_lock.py release --owner "$owner"
          fi

  trigger-web-redeploy:
    name: Redeploy snapdog-web
    needs: [release-meta, publish]
    # Stable root tags only; explicit beta builds never redeploy the website.
    if: ${{ always() && needs.release-meta.outputs.channel == 'release' && needs.publish.outputs.redeploy == 'true' && needs.publish.outputs.release_published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_SNAPDOG_WEB_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::error::VERCEL_SNAPDOG_WEB_DEPLOY_HOOK secret is not set"
            exit 1
          fi
          # snapdog-web (static Astro on Vercel) bakes the latest release tag into
          # the landing-page version badge at build time, so it needs a rebuild
          # after each stable release to pick up the new version.
          echo "Triggering snapdog-web rebuild for ${{ needs.release-meta.outputs.tag_name }}…"
          curl -fsS --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK"
